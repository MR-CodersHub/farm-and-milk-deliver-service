<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account — Meadowly Dairy Co.</title>
  <meta name="description" content="Create your Meadowly account to enjoy small-batch Nilgiris farm milk and daily sunrise doorstep deliveries.">
  <meta name="theme-color" content="#28543B">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <script>
    (() => {
      try {
        const theme = localStorage.getItem("meadowly-theme");
        if (theme === "dark" || (!theme && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.dataset.theme = "dark";
        }
        if (localStorage.getItem("meadowly-dir") === "rtl") document.documentElement.dir = "rtl";
      } catch (error) {}
    })();
  </script>
  <script src="assets/js/app.js" defer></script>
  <script src="assets/js/pages.js" defer></script>
</head>
<body class="auth-page" data-page="signup">
  <main id="main" class="auth-main">
    <div class="auth-card auth-card--signup">
      <div class="auth-brand-wrap">
        <a class="brand" href="index.html" aria-label="Meadowly Dairy Co. — home">
          <span class="brand-mark" aria-hidden="true">
            <svg class="brand-logo-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <circle cx="32" cy="32" r="30" fill="#28543b"/>
              <path d="M6 38 Q32 25 58 38 L58 60 Q32 62 6 60 Z" fill="#1b3d2a"/>
              <path d="M2 46 Q32 38 62 46 L62 62 L2 62 Z" fill="#28543b"/>
              <circle cx="32" cy="18" r="7.5" fill="#f2cb70" opacity="0.95"/>
              <g transform="translate(0, 3)">
                <path d="M27 15 h10 v3.5 h-10 Z" fill="#fffdf6" rx="1.5"/>
                <path d="M26 14 h12 v2 h-12 Z" fill="#f2cb70" rx="1"/>
                <path d="M28.5 18.5 h7 v5.5 h-7 Z" fill="#fffdf6"/>
                <path d="M25 24 h14 l3 7 v16 a4 4 0 0 1 -4 4 h-12 a4 4 0 0 1 -4 -4 v-16 l3 -7 Z" fill="#fffdf6" stroke="#28543b" stroke-width="1.5" stroke-linejoin="round"/>
                <rect x="24.5" y="32" width="15" height="11" rx="2" fill="#f2cb70"/>
                <path d="M32 31 c1.8 2.2, 2.5 3.3, 2.5 4.5 a2.5 2.5 0 0 1 -5 0 c0 -1.2, 0.7 -2.3, 2.5 -4.5 Z" fill="#28543b"/>
                <circle cx="31.2" cy="34" r="0.6" fill="#fffdf6"/>
                <path d="M28 27 v16" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
                <path d="M18 51 c3.5 -4, 8.5 -4.5, 11 -2 c-2 3.5 -6 5 -11 2 Z" fill="#a8b99a"/>
                <path d="M46 51 c-3.5 -4, -8.5 -4.5, -11 -2 c2 3.5, 6 5, 11 2 Z" fill="#a8b99a"/>
              </g>
              <circle cx="32" cy="32" r="28" fill="none" stroke="#f2cb70" stroke-width="0.9" stroke-dasharray="2.5 2" opacity="0.75"/>
            </svg>
          </span>
          <span class="brand-word">Meadowly<small>Dairy Farm &amp; Fresh Milk</small></span>
        </a>
      </div>

      <div class="auth-head">
        <h1>Create Account</h1>
        <p>Create an account to get started with fresh morning milk.</p>
      </div>

      <form class="auth-form" id="signupForm" action="dashboard.html" method="post" novalidate>
        <div class="field">
          <label for="signupName">Full Name</label>
          <input id="signupName" type="text" name="name" placeholder="Meera Raghunathan" autocomplete="name" required>
          <span class="error-text"></span>
        </div>

        <div class="field">
          <label for="signupEmail">Email Address</label>
          <input id="signupEmail" type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
          <span class="error-text"></span>
        </div>

        <div class="field">
          <label for="signupPhone">Phone Number</label>
          <input id="signupPhone" type="tel" name="phone" placeholder="98765 43210" autocomplete="tel" inputmode="tel" required>
          <span class="error-text"></span>
        </div>

        <div class="field">
          <label for="signupPassword">Password</label>
          <div class="password-field">
            <input id="signupPassword" type="password" name="password" placeholder="At least 6 characters" autocomplete="new-password" required>
            <button class="password-toggle" type="button" data-password-toggle aria-label="Show password" aria-pressed="false">
              <svg class="icon icon--eye" aria-hidden="true"><use href="assets/icons.svg#eye"></use></svg>
            </button>
          </div>
          <span class="error-text"></span>
        </div>

        <div class="field">
          <label for="signupConfirmPassword">Confirm Password</label>
          <div class="password-field">
            <input id="signupConfirmPassword" type="password" name="confirmPassword" placeholder="Confirm your password" autocomplete="new-password" required>
            <button class="password-toggle" type="button" data-password-toggle aria-label="Show password" aria-pressed="false">
              <svg class="icon icon--eye" aria-hidden="true"><use href="assets/icons.svg#eye"></use></svg>
            </button>
          </div>
          <span class="error-text"></span>
        </div>

        <div class="field auth-terms-field">
          <label class="check auth-check" for="signupTerms">
            <input id="signupTerms" type="checkbox" name="terms" required>
            <span>I agree to the <a href="contact.html#terms" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Terms &amp; Conditions</a> and <a href="contact.html#privacy" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Privacy Policy</a></span>
          </label>
          <span class="error-text"></span>
        </div>

        <button class="btn btn--primary btn--block auth-submit-btn" type="submit">Create Account</button>
      </form>

      <div class="auth-divider">
        <span>or sign up with</span>
      </div>

      <div class="auth-socials">
        <a href="https://www.google.com/" target="_blank" rel="noopener noreferrer" class="btn--social" aria-label="Sign up with Google">
          <svg class="social-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
          </svg>
          <span>Google</span>
        </a>
        <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" class="btn--social" aria-label="Sign up with Facebook">
          <svg class="social-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" fill="#1877F2"/>
            <path d="M16.671 15.543l.532-3.47h-3.328v-2.25c0-.949.465-1.874 1.956-1.874h1.513V4.996s-1.374-.235-2.686-.235c-2.741 0-4.533 1.662-4.533 4.669v2.643H7.078v3.47h3.047v8.385a12.1 12.1 0 001.875.145c.636 0 1.261-.05 1.875-.145v-8.385h2.796z" fill="#FFFFFF"/>
          </svg>
          <span>Facebook</span>
        </a>
        <a href="https://www.apple.com/" target="_blank" rel="noopener noreferrer" class="btn--social" aria-label="Sign up with Apple">
          <svg class="social-icon social-icon--apple" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 1.01-2.87-.9.04-2 .6-2.65 1.36-.58.68-1.09 1.75-1 2.81 1.01.08 2.02-.55 2.64-1.3" fill="currentColor"/>
          </svg>
          <span>Apple</span>
        </a>
      </div>

      <div class="auth-footer">
        <span>Already have an account?</span>
        <a href="login.html">Sign In</a>
      </div>
    </div>
  </main>
</body>
</html>
